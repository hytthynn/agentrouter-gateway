[project]
name = "agentrouter-gateway"
version = "1.0.0"
description = "Локальный self-hosted шлюз к agentrouter.org с веб-панелью управления"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "hytthynn" }]
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # DB
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    # Шифрование
    "cryptography>=43.0",
    # Транспорт к провайдеру (TLS-имперсонация против Aliyun WAF)
    "curl_cffi>=0.7",
    # Браузерная автоматизация (GitHub OAuth)
    "camoufox[geoip]>=0.4.11",
    "playwright>=1.48",
    "pyotp>=2.9",
    # Планировщик
    "apscheduler>=3.10,<4",
    # Утилиты
    "httpx>=0.27",
]

[project.scripts]
agw = "gateway_app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
]
ignore = [
    "E501",   # длинные строки — ширина таблиц/строк документации
    "B008",   # Depends() в сигнатурах FastAPI — идиома фреймворка
    "RUF001", # RUF001-003: кириллица в строках (проект русскоязычный)
    "RUF002",
    "RUF003",
    "SIM108", # тернарники вместо if/else — читаемость
]

[tool.ruff.lint.per-file-ignores]
"src/gateway_app/db/migrations/*" = ["E501", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "gateway_app.domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
